# ================================================================================
# NEWS SOURCES CONFIGURATION
# ================================================================================
#
# This file contains all news sources, category mappings, and keyword detection
# rules for the get_news_summaries() tool.
#
# Users can edit this file to:
# - Add/remove news RSS feeds
# - Customize category detection terms
# - Modify keyword mappings
# - Adjust category weights and fallbacks
#
# Changes take effect immediately without code modification or server restart.
#
# ================================================================================

# ================================================================================
