# ================================================================================
# CATEGORY MAPPING - Intelligent Category Detection
# ================================================================================
#
# Defines how user queries are mapped to news categories using:
# - primary_terms: Core keywords (high weight)
# - secondary_terms: Related keywords (medium weight)
# - compound_phrases: Multi-word phrases (highest weight)
# - weight: Category priority (0.0 to 1.0)
# - fallback_categories: Alternative categories if primary fails
#
category_mapping:

  crypto:
    primary_terms:
      - crypto
      - cryptocurrency
      - bitcoin
      - btc
      - ethereum
      - eth
      - blockchain
    secondary_terms:
      - defi
      - nft
      - altcoin
      - mining
      - wallet
      - exchange
      - digital currency
      - web3
      - solana
      - cardano
      - polygon
      - binance
      - coinbase
    compound_phrases:
      - crypto news
      - bitcoin price
      - ethereum update
      - blockchain technology
      - digital assets
      - crypto market
      - defi protocol
    financial_crossover:
      - crypto stocks
      - bitcoin etf
      - cryptocurrency investment
      - digital asset trading
    tech_crossover:
      - blockchain development
      - smart contracts
      - cryptocurrency technology
    weight: 1.0
    fallback_categories:
      - finance
      - technology

  finance:
    primary_terms:
      - finance
      - financial
      - stocks
      - market
      - markets
      - stock
    secondary_terms:
      - securities
      - financing
      - bonds
      - wall street
      - nasdaq
      - dow jones
      - trading
      - investment
      - earnings
    compound_phrases:
      - stock market
      - financial news
      - market update
      - earnings report
      - market analysis
      - stock trading
    business_crossover:
      - corporate earnings
      - business finance
      - company stocks
    weight: 0.9
    fallback_categories:
      - business

  economy:
