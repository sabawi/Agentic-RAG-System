# =============================================================================
# LLM Configuration File
# =============================================================================
#
# CRITICAL: Token Parameter Usage by Provider Type
# ------------------------------------------------
# 
# For OLLAMA providers (type: ollama):
#   • context_window_size → Maps to Ollama 'num_ctx' parameter (input context limit)
#   • num_predict         → Maps to Ollama 'num_predict' parameter (output tokens limit)
#   • max_tokens          → IGNORED (kept for backward compatibility only)
#
# For NON-OLLAMA providers (type: openai, qwen, gemini, etc.):
#   • context_window_size → Used for input context size management
#   • max_tokens          → Used for output tokens limit (native API parameter)
#   • num_predict         → Available but typically unused by these providers
#
# Parameter Priority (all providers):
#   1. Request-level parameters (highest priority)
#   2. Configuration file parameters  
#   3. Provider-specific defaults (lowest priority)
#
# =============================================================================

debug:
  log_requests: false
  log_timing: true
  mock_providers: false
llm:
  fallback:
    auto_switch: true
    enabled: true
    order:
    - ollama
    - openai
    - qwen
    - gemini
  primary:
    type: ollama
    config:
      model: deepseek-v3.1:671b-cloud 
      timeout: 3600  # 60 minutes for local models with large contexts
      context_window_size: 32768  # Increased from 8192 to support comprehensive document searches
      temperature: 0.7
      num_predict: 16384
      max_tokens: 32768  # Increased to match context_window_size
      base_url: http://127.0.0.1:11434
      api_key: null
      stream: true
      think: false  # Configurable think parameter for reasoning
  tool_calling:
    type: openai
    config:
      model: gpt-4o-mini
      timeout: 120
      context_window_size: 4096
      temperature: 0.1  # Lower for tool calling
      max_tokens: 1024
      stream: false
  providers:
    ollama:
      health_check_url: http://127.0.0.1:11434/api/tags
      retry_attempts: 3
      retry_delay: 2
    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: https://api.openai.com/v1
      organization: null
      retry_attempts: 3
      retry_delay: 1
      models:
        primary: gpt-4o
        tool_calling: gpt-4o
performance:
  connection_pool_size: 10
  max_concurrent_requests: 5
  request_timeout: 600
  streaming_chunk_size: 1024
platform:
  config_dir:
    linux: ${HOME}/.config/agentic_rag
    macos: ${HOME}/.config/agentic_rag
    windows: ${APPDATA}/agentic_rag
  log_dir:
    linux: ${HOME}/.local/share/agentic_rag/logs
    macos: ${HOME}/.local/share/agentic_rag/logs
    windows: ${LOCALAPPDATA}/agentic_rag/logs
  temp_dir:
    linux: /tmp/agentic_rag
    macos: ${TMPDIR}/agentic_rag
    windows: ${TEMP}/agentic_rag
security:
  api_key_encryption: false
  audit_logging: true
  rate_limiting:
    enabled: true
    requests_per_minute: 60
    burst_limit: 10
arbitrator:
  enabled: true
  type: openai
  config:
    model: gpt-4o-mini
    timeout: 60
    context_window_size: 4096
    temperature: 0.1
    max_tokens: 1024
    stream: false
    api_key: ${OPENAI_API_KEY}
    base_url: https://api.openai.com/v1
optimization:
  enabled: true
  rollout_percentage: 100.0
  detailed_logging: true
vision:
  type: ollama
  config:
    model: qwen2.5vl:3b
    timeout: 3600  # 60 minutes for vision processing with large images
    base_url: http://127.0.0.1:11434
    fallback_model: bakllava:latest
    think: false  # Configurable think parameter for vision tasks
flight_search:
  enabled: true
  web_scraping:
    enabled: true
    timeout_seconds: 30
    max_results: 10
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
  apis:
    # Flight search API providers - Add your API keys here
    amadeus:
      enabled: false
      api_key: ${AMADEUS_API_KEY}
      api_secret: ${AMADEUS_API_SECRET}
      base_url: "https://test.api.amadeus.com"
      # Change to "https://api.amadeus.com" for production
    skyscanner:
      enabled: false
      api_key: ${SKYSCANNER_API_KEY}
      base_url: "https://partners.api.skyscanner.net"
    serpapi:
      enabled: false
      api_key: ${SERPAPI_API_KEY}
      base_url: "https://serpapi.com/search.json"
      # SerpAPI for Google Flights scraping
    rapidapi_skyscanner:
      enabled: false
      api_key: ${RAPIDAPI_KEY}
      base_url: "https://skyscanner50.p.rapidapi.com"
      host: "skyscanner50.p.rapidapi.com"
  verification_links:
    # These booking sites are always included for verification
    kayak: "https://www.kayak.com/flights"
    expedia: "https://www.expedia.com/Flights-Search"
    google_flights: "https://www.google.com/travel/flights"
    priceline: "https://www.priceline.com/relax/at/flights"
    momondo: "https://www.momondo.com/flight-search"
  chromedriver:
    # ChromeDriver configuration for web scraping
    path: ${CHROMEDRIVER_PATH}  # Optional: specify custom path
    auto_install: true
    headless: true
    timeout: 30
    window_size: "1920,1080"
email:
  # =============================================================================
  # Email Management Configuration
  # =============================================================================
  # Universal email library integration for retrieval, search, and management
  # Enables natural language queries like:
  # - "List my unread emails from gmail"
  # - "Show emails from Reema about university in last 7 days"
  # - "Find Apple billing notifications"

  # Enable the unified email management system
  enabled: true

  # Default provider for operations (when not specified)
  default_provider: "gmail_primary"

  # Email retrieval settings
  retrieval:
    default_timeout: 30
    max_emails_per_request: 50
    auto_mark_read: false
    default_retrieval_type: "headers"  # "headers" (fast) or "full" (complete)
    cache_duration: 300  # Cache results for 5 minutes

  # Email sending settings (integrates with existing secure_email_sender)
  sending:
    auto_cleanup_attachments: true
    max_attachment_size_mb: 25
    wait_for_attachments: true
    attachment_timeout: 45
    preserve_existing_functionality: true  # Ensures backward compatibility

  # Security settings
  security:
    allowed_attachment_types: [".pdf", ".html", ".txt", ".md", ".csv", ".json", ".xml", ".log", ".doc", ".docx", ".xls", ".xlsx", ".ppt", ".pptx", ".zip"]
    forbidden_attachment_types: [".exe", ".bat", ".cmd", ".com", ".scr", ".pif", ".msi", ".dll"]
    max_recipients: 50
    require_auth: true
    enable_app_passwords: true

  # Email providers configuration
  providers:
    gmail_primary:
      email: "${GMAIL_PRIMARY_EMAIL}"
      password: "${GMAIL_PRIMARY_APP_PASSWORD}"
      imap:
        server: "imap.gmail.com"
        port: 993
        use_ssl: true
      smtp:
        server: "smtp.gmail.com"
        port: 587
        use_tls: true
      pop3:
        server: "pop.gmail.com"
        port: 995
        use_ssl: true
      description: "Primary Gmail account for personal/main email"

    gmail_work:
      email: "${GMAIL_WORK_EMAIL}"
      password: "${GMAIL_WORK_APP_PASSWORD}"
      imap:
        server: "imap.gmail.com"
        port: 993
        use_ssl: true
      smtp:
        server: "smtp.gmail.com"
        port: 587
        use_tls: true
      description: "Work Gmail account"

    outlook_personal:
      email: "${OUTLOOK_PERSONAL_EMAIL}"
      password: "${OUTLOOK_PERSONAL_PASSWORD}"
      imap:
        server: "outlook.office365.com"
        port: 993
        use_ssl: true
      smtp:
        server: "smtp.office365.com"
        port: 587
        use_tls: true
      description: "Personal Outlook/Hotmail account"

    outlook_work:
      email: "${OUTLOOK_WORK_EMAIL}"
      password: "${OUTLOOK_WORK_PASSWORD}"
      imap:
        server: "outlook.office365.com"
        port: 993
        use_ssl: true
      smtp:
        server: "smtp.office365.com"
        port: 587
        use_tls: true
      description: "Work Outlook/Office 365 account"

    yahoo_personal:
      email: "${YAHOO_PERSONAL_EMAIL}"
      password: "${YAHOO_PERSONAL_APP_PASSWORD}"
      imap:
        server: "imap.mail.yahoo.com"
        port: 993
        use_ssl: true
      smtp:
        server: "smtp.mail.yahoo.com"
        port: 587
        use_tls: true
      pop3:
        server: "pop.mail.yahoo.com"
        port: 995
        use_ssl: true
      description: "Personal Yahoo Mail account"

    icloud_personal:
      email: "${ICLOUD_PERSONAL_EMAIL}"
      password: "${ICLOUD_PERSONAL_APP_PASSWORD}"
      imap:
        server: "imap.mail.me.com"
        port: 993
        use_ssl: true
      smtp:
        server: "smtp.mail.me.com"
        port: 587
        use_tls: true
      description: "Personal iCloud Mail account"

    custom_server:
      email: "${CUSTOM_EMAIL}"
      password: "${CUSTOM_PASSWORD}"
      imap:
        server: "${CUSTOM_IMAP_SERVER}"
        port: "${CUSTOM_IMAP_PORT:993}"
        use_ssl: true
      smtp:
        server: "${CUSTOM_SMTP_SERVER}"
        port: "${CUSTOM_SMTP_PORT:587}"
        use_tls: true
      description: "Custom IMAP/SMTP server"

  # Global email settings
  settings:
    default_timeout: 30
    max_attachment_size_mb: 25
    date_format: "%Y-%m-%d %H:%M:%S"
    encoding: "utf-8"
    max_search_results: 100
    connection_retry_attempts: 3
    connection_retry_delay: 2

  # Natural language processing settings
  nlp:
    enable_smart_parsing: true
    enable_sender_detection: true
    enable_date_parsing: true
    enable_content_filtering: true
    enable_company_detection: true
    enable_fuzzy_matching: true
    confidence_threshold: 0.7
