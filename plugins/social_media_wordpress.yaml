metadata:
  name: "social_media_wordpress"
  version: "1.0.0"
  category: "communications"
  author: "Gemini"
  description: |
    Publish posts to a WordPress site using Application Passwords.
    Supports both self-hosted WordPress (REST API) and WordPress.com (XML-RPC).
  tags:
    - social-media
    - wordpress
    - publishing
    - blogging

execution:
  type: "python"
  handler: "handlers/social_media_wordpress.py"
  entrypoint: "execute"
  timeout: 60                         # 60 seconds (publishing can be slow)
  memory_limit: 256                   # 256MB
  cpu_limit: 1.0                      # 1 CPU core

  environment:
    WORDPRESS_URL_ENV: "WORDPRESS_URL"
    WORDPRESS_USERNAME_ENV: "WORDPRESS_USERNAME"
    WORDPRESS_APP_PASSWORD_ENV: "WORDPRESS_APP_PASSWORD"

parameters:
  type: "object"
  properties:
    title:
      type: "string"
      description: "The title of the post."
      minLength: 1
    content:
      type: "string"
      description: "The content of the post (HTML)."
      minLength: 1
    status:
      type: "string"
      description: |
        The status of the post (e.g., 'publish', 'draft').
        🔒 SAFETY: Defaults to 'draft' to prevent accidental public publishing.
        Posts will be created as drafts unless explicitly specified otherwise.
      enum:
        - "publish"
        - "draft"
        - "pending"
        - "private"
      default: "draft"
    categories:
      type: "array"
      items:
        type: "string"
      description: "Array of category names to assign to the post. Categories will be created if they don't exist."
      default: []
    tags:
      type: "array"
      items:
        type: "string"
      description: "Array of tags to assign to the post."
      default: []
  required:
    - "title"
    - "content"

security:
  input_validation:
    max_string_length: 1000000        # 1MB for content
    max_array_length: 10              # Max 10 categories/tags
    allowed_types: ["string", "array"]

  output_validation:
    max_output_size: 10485760         # 10MB
    allowed_content_types: ["application/json"]

  network:
    enabled: true
    allowed_domains:
      - "*.wordpress.com"
      - "*.wp.com"
      # User will need to add their self-hosted domain if applicable
    allowed_ports:
      - 443                           # HTTPS only
    block_private_ips: true

  filesystem:
    read_only: true                   # No file writes needed
    allowed_paths: []
    blocked_paths:
      - "/etc"
      - "/root"
      - "/home"

monitoring:
  log_level: "INFO"
  log_execution: true
  log_outputs: false                  # Don't log content (may be sensitive)
  metrics:
    track_execution_time: true
    track_success_rate: true
    alert_on_failure_rate: 0.2        # Alert if > 20% failures

dependencies:
  python_packages:
    - requests>=2.32.0
    - bleach>=6.0.0
    - xmlrpc.client # This is a standard library module, but good to list for clarity

  checks:
    - type: "env_var"
      name: "WORDPRESS_URL"
      required: true
    - type: "env_var"
      name: "WORDPRESS_USERNAME"
      required: true
    - type: "env_var"
      name: "WORDPRESS_APP_PASSWORD"
      required: true

error_handling:
  retry:
    enabled: true
    max_attempts: 3
    backoff_strategy: "exponential"
    initial_delay: 2
    retry_on_http_codes: [429, 500, 502, 503, 504]

  degraded_mode:
    enabled: true
    disable_after_failures: 5         # Disable after 5 consecutive failures
    cooldown_period: 300              # 5 minutes
