<!DOCTYPE html>
<html>
<head>
    <title>Space Invaders</title>
    <style>
        body { background-color: black; color: white; font-family: Arial, sans-serif; }
        #game { position: relative; width: 800px; height: 600px; background-color: #000; }
        #score { position: absolute; top: 10px; left: 10px; font-size: 24px; }
        .invader { position: absolute; width: 50px; height: 50px; background-color: red; }
        .bullet { position: absolute; width: 10px; height: 10px; background-color: yellow; }
        .player { position: absolute; width: 50px; height: 20px; background-color: blue; }
    </style>
</head>
<body>
    <div id="score">Score: 0</div>
    <div id="game"></div>
    <button onclick="startGame()">Start</button>
    <button onclick="restartGame()">Restart</button>

    <script>
        let gameContainer = document.getElementById('game');
        let scoreDisplay = document.getElementById('score');
        let score = 0;
        let invaders = [];
        let bullets = [];
        let player = null;
        let gameInterval = null;
        let isGameOver = false;

        function startGame() {
            gameContainer.innerHTML = '';
            score = 0;
            scoreDisplay.textContent = 'Score: 0';
            isGameOver = false;
            invaders = [];
            bullets = [];
            player = createPlayer();
            spawnInvaders();
            gameInterval = setInterval(updateGame, 1000 / 10);
        }

        function restartGame() {
            clearInterval(gameInterval);
            startGame();
        }

        function createPlayer() {
            let playerDiv = document.createElement('div');
            playerDiv.className = 'player';
            playerDiv.style.left = '375px';
            gameContainer.appendChild(playerDiv);
            return playerDiv;
        }

        function spawnInvaders() {
            for (let i = 0; i < 10; i++) {
                let invader = document.createElement('div');
                invader.className = 'invader';
                invader.style.left = (i * 80) + 'px';
                invader.style.top = '50px';
                gameContainer.appendChild(invader);
                invaders.push(invader);
            }
        }

        function updateGame() {
            if (isGameOver) return;

            movePlayer();
            moveBullets();
            moveInvaders();
            checkCollisions();
        }

        function movePlayer() {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowLeft') {
                    player.style.left = (player.offsetLeft - 10) + 'px';
                } else if (e.key === 'ArrowRight') {
                    player.style.left = (player.offsetLeft + 10) + 'px';
                } else if (e.key === ' ') {
                    shootBullet();
                }
            });
        }

        function shootBullet() {
            let bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = (player.offsetLeft + 25) + 'px';
            bullet.style.top = '520px';
            gameContainer.appendChild(bullet);
            bullets.push(bullet);
        }

        function moveBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                bullet.style.top = (bullet.offsetTop - 5) + 'px';

                if (bullet.offsetTop < 0) {
                    bullets.splice(i, 1);
                    gameContainer.removeChild(bullet);
                }
            }
        }

        function moveInvaders() {
            let moveAmount = 1;
            let direction = 1;
            let invaderPositions = invaders.map(invader => parseInt(invader.style.left));
            let invaderBottomPositions = invaders.map(invader => parseInt(invader.style.top));

            for (let i = 0; i < invaders.length; i++) {
                let invader = invaders[i];
                let invaderLeft = parseInt(invader.style.left);
                let invaderTop = parseInt(invader.style.top);

                invader.style.left = (invaderLeft + moveAmount * direction) + 'px';
                invader.style.top = (invaderTop + 1) + 'px';
            }

            let newInvaderPositions = invaders.map(invader => parseInt(invader.style.left));
            let newInvaderBottomPositions = invaders.map(invader => parseInt(invader.style.top));

            if (newInvaderPositions.some(pos => pos < 0 || pos > 750) || newInvaderBottomPositions.some(pos => pos > 550)) {
                direction *= -1;
                moveAmount = 1;
                for (let i = 0; i < invaders.length; i++) {
                    invaders[i].style.left = (invaders[i].offsetLeft + moveAmount * direction) + 'px';
                }
            }
        }

        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                for (let j = invaders.length - 1; j >= 0; j--) {
                    let invader = invaders[j];
                    let bulletRect = bullet.getBoundingClientRect();
                    let invaderRect = invader.getBoundingClientRect();

                    if (bulletRect.left < invaderRect.right &&
                        bulletRect.right > invaderRect.left &&
                        bulletRect.top < invaderRect.bottom &&
                        bulletRect.bottom > invaderRect.top) {
                        score += 10;
                        scoreDisplay.textContent = 'Score: ' + score;
                        gameContainer.removeChild(invader);
                        invaders.splice(j, 1);
                        bullets.splice(i, 1);
                        gameContainer.removeChild(bullet);
                        break;
                    }
                }
            }

            if (invaders.length === 0) {
                clearInterval(gameInterval);
                alert('You Win! Score: ' + score);
                return;
            }

            for (let invader of invaders) {
                if (invader.offsetTop > 550) {
                    clearInterval(gameInterval);
                    alert('Game Over! Score: ' + score);
                    isGameOver = true;
                    return;
                }
            }
        }
    </script>
</body>
</html>
