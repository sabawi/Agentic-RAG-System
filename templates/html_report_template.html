<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>{{TITLE}}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.4;
            color: #333;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
        }

        .header {
            background-color: #4a90e2;
            color: #fff;
            text-align: center;
            padding: 16px;
            border-radius: 4px;
        }

        .header h1 {
            font-size: 20px;
            margin: 0;
            line-height: 1.2;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 13px;
            line-height: 1.3;
        }

        h2 {
            font-size: 16px;
            margin-top: 24px;
            margin-bottom: 8px;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 4px;
        }

        h3 {
            font-size: 15px;
            margin: 18px 0 6px;
        }

        p {
            margin: 8px 0;
            text-align: justify;
        }

        ul {
            padding-left: 18px;
            margin: 8px 0;
        }

        li {
            margin-bottom: 6px;
        }

        .metric {
            background-color: #f1f3f5;
            border-left: 4px solid #4a90e2;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 6px 0;
        }

        .news-item {
            background-color: #fafafa;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 4px;
            margin: 12px 0;
        }

        .recommendation {
            background-color: #28a745;
            color: white;
            padding: 14px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            margin: 20px 0;
        }

        .warning {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px;
            border-radius: 4px;
            margin: 16px 0;
        }

        .timestamp {
            background-color: #eee;
            color: #666;
            text-align: center;
            font-size: 12px;
            font-style: italic;
            padding: 10px;
            margin-top: 20px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>{{HEADER_TITLE}}</h1>
            <p>{{HEADER_SUBTITLE}}</p>
        </div>

        <div class="content">
            {{CONTENT}}

            {{DISCLAIMER}}

            <div class="timestamp">
                {{TIMESTAMP}}
            </div>
        </div>
    </div>
</body>

</html>
